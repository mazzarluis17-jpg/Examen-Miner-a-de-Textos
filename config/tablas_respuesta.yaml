          a su cargo)'
      estados:
        tipo: LOC
        filtro: entidades_federativas
        patrones_contexto:
        - tren maya|tramo|constru|recorr|pas[ao]|conect
        relacion: ubicación de obras del Tren Maya
        unidad: ''
        exclusivo: false
        patrones_vinculo:
        - (?:en|desde|hasta|tramo|atraviesa|estado de|estados de)[^.!?]{0,65}{valor}
        - '{valor}[^.!?]{0,65}(?:tramo|construcci[oó]n)'
      montos:
        tipo: MONTO
        filtro: ''
        patrones_contexto:
        - inver|costo|presupuest|recurso|destin|ejerc
        relacion: inversión en el Tren Maya
        unidad: ''
        exclusivo: false
        patrones_vinculo:
        - (?:inversi[oó]n|invierte|invertir|costo|presupuesto|recursos|destinad)[^.!?]{0,65}{valor}
        - '{valor}[^.!?]{0,65}(?:de inversi[oó]n|para el tren maya)'
