    anclas:
    - tren maya
    campos:
      dependencias_y_empresas:
        tipo: ORG
        filtro: ''
        patrones_contexto:
        - particip|constru|contrat|empresa|trabaj|encarg|cargo|tramo
        relacion: participación en el Tren Maya
        unidad: ''
        exclusivo: false
        patrones_vinculo:
        - (?:participa|construye|construyen|contratad[ao]|trabaj[ao] de|a cargo de|encargad[ao]|realizad[ao]
          por)[^.!?]{0,65}{valor}
